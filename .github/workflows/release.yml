name: Release

# The owner pushes a vX.Y.Z tag on a main commit. check-tag verifies the tag.
# The release job builds the release files, attests each file, and fills a
# draft release. The owner publishes the draft by hand and chooses pre-release or
# stable at that moment. No reviewer workflow runs here. Every tagged commit
# already passed review on its way to main.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag must match the top changelog version and a digest index entry. The
  # synchronized copies must match AGENTS.md. The commit must be on main.
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Check tag against the changelog and digest index
        run: python scripts/release.py check-tag "$GITHUB_REF_NAME"
      - name: Check synchronized copies and digest index
        run: python scripts/sync.py --check
      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA. That commit is not on main. Tag a main commit."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME points to a commit on main."

  # Only this job writes. It never publishes and never sets the channel. A
  # rerun reuses the draft. A file already on the draft must match this
  # build's SHA-256, and a mismatch stops the job.
  release:
    needs: check-tag
    # The repository owner configures this environment with a required
    # reviewer. The job receives its write token only after that approval.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Build release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/release.py build "$version" "$RUNNER_TEMP/release-assets"
          python scripts/release.py check-assets "$RUNNER_TEMP/release-assets" "$version"
      # Only a "release not found" answer means no draft exists. Any other
      # lookup failure stops the job. A transient or permission error then
      # cannot send a rerun down the fresh-draft path.
      - name: Inspect existing draft
        id: draft
        run: |
          tag="$GITHUB_REF_NAME"
          lookup_error="$(mktemp "$RUNNER_TEMP/draft-lookup.XXXXXX")"
          if ! is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$lookup_error")"; then
            if grep -Fq "release not found" "$lookup_error"; then
              echo "release_exists=false" >> "$GITHUB_OUTPUT"
              echo "bundle_on_draft=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$lookup_error"
            echo "The lookup of release $tag failed. Check the token permissions and GitHub status, then rerun the release job."
            exit 1
          fi
          echo "release_exists=true" >> "$GITHUB_OUTPUT"
          if [ "$is_draft" != "true" ]; then
            echo "Release $tag is already published. This job only fills drafts."
            exit 1
          fi
          bundle="agents-${tag#v}.sigstore.json"
          names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$names" | grep -Fxq -- "$bundle"; then
            echo "bundle_on_draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_on_draft=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest release files
        id: attest
        if: steps.draft.outputs.bundle_on_draft != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/agents-*
      # A draft asset counts as untrusted input. A reused bundle must verify against
      # every file this run built before it joins the release.
      - name: Save attestation bundle
        env:
          NEW_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets="$RUNNER_TEMP/release-assets"
          bundle="$assets/agents-${tag#v}.sigstore.json"
          if [ -n "$NEW_BUNDLE" ]; then
            cp "$NEW_BUNDLE" "$bundle"
          else
            download="$(mktemp -d "$RUNNER_TEMP/draft-bundle.XXXXXX")"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$bundle")" --dir "$download"
            for file in "$assets"/agents-*; do
              gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --bundle "$download/$(basename "$bundle")"
            done
            cp "$download/$(basename "$bundle")" "$bundle"
          fi
          python scripts/release.py check-assets "$assets" "${tag#v}" --require-bundle
      - name: Write checksums and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # GitHub lists releases by creation time. The helper picks the
          # highest stable version instead.
          stable_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')"
          since="$(printf '%s\n' "$stable_tags" | python scripts/release.py latest-stable)"
          python scripts/release.py checksums "$RUNNER_TEMP/release-assets"
          if [ -n "$since" ]; then
            python scripts/release.py notes "$version" "$RUNNER_TEMP/release-notes.md" --since "$since"
          else
            python scripts/release.py notes "$version" "$RUNNER_TEMP/release-notes.md"
          fi
          cat "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"
      - name: Attest checksums file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/SHA256SUMS.txt
      - name: Upload to draft release
        env:
          RELEASE_EXISTS: ${{ steps.draft.outputs.release_exists }}
        run: |
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          assets="$RUNNER_TEMP/release-assets"
          # The owner can publish the draft while this job runs. Each write
          # rechecks the draft state first and stops on a published release.
          require_draft() {
            state="$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft)"
            if [ "$state" != "true" ]; then
              echo "Release $tag is no longer a draft. This job never changes a published release."
              exit 1
            fi
          }
          if [ "$RELEASE_EXISTS" != "true" ]; then
            gh release create "$tag" --repo "$repo" --draft --verify-tag \
              --title "agents $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          else
            # A rerun refreshes the notes of the existing draft. GitHub
            # generates the merged pull request list again for the tag.
            generated="$(gh api --method POST "repos/$repo/releases/generate-notes" -f tag_name="$tag" --jq .body)"
            refreshed="$RUNNER_TEMP/refreshed-notes.md"
            {
              cat "$RUNNER_TEMP/release-notes.md"
              printf '\n'
              printf '%s\n' "$generated"
            } > "$refreshed"
            require_draft
            gh release edit "$tag" --repo "$repo" --notes-file "$refreshed"
          fi
          existing="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
          while IFS= read -r name; do
            if [ -n "$name" ] && [ ! -f "$assets/$name" ]; then
              echo "The draft holds $name. This build makes no such file."
              echo "Delete $name from the draft, then rerun the release job."
              exit 1
            fi
          done <<< "$existing"
          for file in "$assets"/*; do
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -Fxq -- "$name"; then
              check="$(mktemp -d "$RUNNER_TEMP/existing-asset.XXXXXX")"
              gh release download "$tag" --repo "$repo" --pattern "$name" --dir "$check"
              old="$(sha256sum "$check/$name" | cut -d ' ' -f 1)"
              new="$(sha256sum "$file" | cut -d ' ' -f 1)"
              if [ "$old" != "$new" ]; then
                echo "$name on the draft has SHA-256 $old, but this build made $new."
                echo "Delete the draft release, then push the tag build again."
                exit 1
              fi
              echo "$name is already on the draft with the same SHA-256."
            else
              require_draft
              gh release upload "$tag" "$file" --repo "$repo"
            fi
          done
          echo "Draft release $tag holds every release file. Publish it by hand."
