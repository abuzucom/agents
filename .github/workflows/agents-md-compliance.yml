name: AGENTS.md Compliance

on:
  pull_request:
    # Stable branches. develop is the staging branch. Absent branches never match.
    branches: [ main, test, develop ]
    # The reusable pr-checks job runs on drafts. ready_for_review reruns it
    # when a draft pull request becomes ready.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compliance:
    uses: ./.github/workflows/agents-compliance.yml
